<section class="w-full">
  <div class="w-full p-4 mx-auto">
    <div class="grid gap-4 mx-4 sm:grid-cols-12">

      <!-- Left column: logo and university name -->
      <div class="col-span-12 sm:col-span-3" data-aos="fade-right">
        <div class="text-center sm:text-left mb-14">

          <a [href]="education().websiteLink" target="_blank"
             class="text-sm w-full text-center font-bold block tracking-wider text-gray-600">
            {{ education().universityName }}
          </a>
        </div>
      </div>

      <!-- Right column: timeline / details -->
      <div class="relative col-span-12 px-4 space-y-6 sm:col-span-9" data-aos="fade-left">
        <div class="col-span-12 space-y-12 relative px-4 sm:col-span-8 sm:space-y-8 sm:before:absolute sm:before:top-2 sm:before:bottom-0 sm:before:w-0.5 sm:before:-left-3 before:bg-gray-300">

          <div class="flex flex-col sm:relative sm:before:absolute sm:before:top-2 sm:before:w-4 sm:before:h-4 sm:before:rounded-full sm:before:left-[-35px] sm:before:z-[1] before:bg-blue-800">
            <h3 class="md:text-left text-xl font-semibold tracking-wide">
              {{ education().degreeName }}
            </h3>

            <span class="md:text-left text-xs font-bold mt-2 tracking-wide uppercase">
              {{ education().duration }}
            </span>

            <p *ngFor="let ep of education().studyPoints" class="mt-3 md:text-left text-gray-600 text-lg">
               {{ ep }}
            </p>
          </div>

        </div>
      </div>

    </div>
  </div>
</section>
